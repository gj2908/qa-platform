<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <style>
      body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
      table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
      body { margin: 0; padding: 0; width: 100% !important; }
      @media screen and (max-width: 600px) {
        .email-container { width: 100% !important; }
        .email-padding { padding-left: 20px !important; padding-right: 20px !important; }
      }
    </style>
  </head>
  <body style="margin:0;padding:32px 16px;background-color:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="email-container" style="max-width:520px;margin:0 auto;">
            <tr>
              <td style="background-color:#ffffff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td class="email-padding" style="background-color:#3358d4;padding:18px 28px;">
                      <span style="color:#ffffff;font-size:15px;font-weight:600;letter-spacing:-0.01em;">Vrsnify</span>
                    </td>
                  </tr>
                  <tr>
                    <td class="email-padding" style="padding:28px;color:#1f2430;font-size:14px;line-height:1.65;">
                      <h1 style="margin:0 0 16px;font-size:18px;font-weight:600;color:#0a0a0a;">Verify your email</h1>
                      <p style="margin:0 0 16px;">Enter this code to verify your Vrsnify account:</p>
                      <div style="margin:0 0 16px;padding:16px;background-color:#f8f9fb;border-radius:8px;text-align:center;">
                        <span style="font-size:28px;font-weight:700;letter-spacing:6px;font-family:ui-monospace,Menlo,monospace;color:#0a0a0a;">{{ .Token }}</span>
                      </div>
                      <p style="margin:0 0 4px;">Or, if you'd rather just click through:</p>
                      <div style="margin-top:16px;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background-color:#3358d4;color:#ffffff;text-decoration:none;padding:10px 22px;border-radius:8px;font-weight:500;font-size:14px;">Verify email</a></div>
                      <p style="margin:24px 0 0;color:#9aa0ab;font-size:12px;line-height:1.6;">
                        This code and link expire shortly and can only be used once. If you didn't
                        create an account, you can safely ignore this email.
                      </p>
                    </td>
                  </tr>
                  <tr>
                    <td class="email-padding" style="padding:16px 28px;border-top:1px solid #f0f1f3;">
                      <p style="margin:0;color:#9aa0ab;font-size:12px;">Sent by Vrsnify.</p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
